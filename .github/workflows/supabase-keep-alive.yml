name: Supabase Keep-Alive

on:
  schedule:
    # Executa a cada 3 dias às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite execução manual a qualquer momento pelo painel do GitHub

jobs:
  ping-supabase:
    name: Manter Supabase Ativo
    runs-on: ubuntu-latest
    steps:
      - name: Enviar requisição HTTP leve para evitar pausa por inatividade
        run: |
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1YnJmcW90ZG1laGtsYm1ldXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NzE4NjEsImV4cCI6MjEwNDA0Nzg2MX0.bbwZUIxUa3m5g1Q2SeoxItfjXXSRSkneTMILo99KNxQ"
          fi

          echo "Enviando ping para o Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://fubrfqotdmehklbmeutn.supabase.co/rest/v1/business_settings?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json")

          echo "Resposta HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase pingado com sucesso! Projeto permanece ativo."
          else
            echo "⚠️ Aviso: Resposta HTTP $HTTP_STATUS recebida do Supabase."
          fi
